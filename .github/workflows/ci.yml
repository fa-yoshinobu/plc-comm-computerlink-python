name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check release workflows do not auto-publish
        shell: pwsh
        run: ./scripts/check_no_auto_publish.ps1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check GitHub source archive build and tests
        if: matrix.python-version == '3.10'
        shell: pwsh
        run: ./scripts/check_source_archive.ps1

      - name: Run Ruff lint
        run: python -m ruff check toyopuc tests scripts samples

      - name: Run Ruff format check
        run: python -m ruff format --check toyopuc tests scripts samples

      - name: Run mypy
        run: python -m mypy toyopuc

      - name: Run tests
        run: python -m pytest -q

      - name: Validate wheel and sdist contents
        if: matrix.python-version == '3.10'
        shell: pwsh
        run: ./scripts/check_package_contents.ps1

  windows-contract-smoke:
    name: Windows representative contract smoke
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install smoke-test dependency
        run: python -m pip install pytest

      - name: Run representative Windows transport lifecycle contracts
        run: >-
          python -m pytest -q
          tests/test_client_retry.py::test_tcp_fragmented_header_and_body_are_received_under_one_request
          tests/test_client_retry.py::test_late_socket_completion_is_closed_and_never_adopted
          tests/test_client_retry.py::test_native_connect_timeout_before_absolute_deadline_is_transport_failure
          tests/test_client_retry.py::test_close_during_dns_is_distinct_and_cannot_adopt_late_result
          tests/test_client_retry.py::test_connect_retries_pre_send_socket_failure
          tests/test_client_retry.py::test_fixed_port_udp_session_is_terminal_after_uncertain_timeout
          tests/test_client_retry.py::test_timed_out_tcp_transport_can_explicitly_reconnect_and_exchange_on_same_client
          tests/test_client_retry.py::test_close_retires_active_and_queued_generation_but_allows_new_work
          tests/test_client_retry.py::test_async_close_retires_admitted_generation_and_new_call_uses_next_generation
