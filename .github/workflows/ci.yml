name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check release workflows do not auto-publish
        shell: pwsh
        run: ./scripts/check_no_auto_publish.ps1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check GitHub source archive build and tests
        if: matrix.python-version == '3.10'
        shell: pwsh
        run: ./scripts/check_source_archive.ps1

      - name: Run Ruff lint
        run: python -m ruff check toyopuc tests scripts samples

      - name: Run Ruff format check
        run: python -m ruff format --check toyopuc tests scripts samples

      - name: Run mypy
        run: python -m mypy toyopuc

      - name: Run tests
        run: python -m pytest -q

      - name: Validate wheel and sdist contents
        if: matrix.python-version == '3.10'
        shell: pwsh
        run: ./scripts/check_package_contents.ps1
